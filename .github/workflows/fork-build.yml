name: Fork build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonoCode-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      - name: Build Linux packages
        run: npm run build:linux

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonoCode-linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: MonoCode-windows-x64
          path: release/

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: MonoCode-linux-x64
          path: release/

      - name: Flatten release files
        run: |
          set -euo pipefail
          mkdir -p dist
          find release -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MonoCode $VERSION" \
            --notes "Automated fork build of $GITHUB_SHA." \
            dist/*
